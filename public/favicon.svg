<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#faf9f7"/>
  
  <!-- Yarn spool (faint background) -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="#ddd" stroke-width="2"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#ddd" stroke-width="1"/>
  
  <!-- Main thread/yarn (thick, very visible) -->
  <path d="M 28 70 Q 45 40 72 28" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Needle (bold and clear) -->
  <g>
    <!-- Needle shaft -->
    <line x1="72" y1="26" x2="38" y2="76" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <!-- Needle point (sharp triangle) -->
    <polygon points="38,76 34,82 42,78" fill="#1a1a1a"/>
    <!-- Needle eye -->
    <ellipse cx="70" cy="28" rx="4" ry="3.5" fill="#1a1a1a"/>
    <ellipse cx="70" cy="28" rx="2" ry="1.5" fill="#faf9f7"/>
  </g>
  
  <!-- Thread shine/highlight -->
  <path d="M 28 70 Q 45 40 72 28" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
